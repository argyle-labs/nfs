# The orca repo is private. Use the git CLI (which inherits the operator's
# authenticated gh / ssh credentials) so cargo can resolve the `plugin-toolkit`
# git source pinned in Cargo.toml.
[net]
git-fetch-with-cli = true

# orca's workspace manifest references `registry = "gitea"`; cargo cannot load
# the plugin-toolkit git dep unless that registry name resolves here too.
[registries.gitea]
index = "sparse+https://gitea.scottkey.me/api/packages/argyle-labs/cargo/"

# ci.yml for a Rust-only plugin: copy to .github/workflows/ci.yml. Each job is
# a shared piece from argyle-labs/.github; add no steps here. A crate over the
# default runners' memory cap passes `runs-on: ci-large` (and optionally
# `build-jobs` / `debuginfo`) to every piece.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the pass cache'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: argyle-labs/.github/.github/workflows/rust-build.yml@feat/reusable-plugin-ci
    secrets: inherit
  test:
    needs: build
    uses: argyle-labs/.github/.github/workflows/rust-test.yml@feat/reusable-plugin-ci
    secrets: inherit
  lint:
    uses: argyle-labs/.github/.github/workflows/rust-lint.yml@feat/reusable-plugin-ci
    secrets: inherit
  lint-doctest:
    uses: argyle-labs/.github/.github/workflows/rust-doctest.yml@feat/reusable-plugin-ci
    secrets: inherit
